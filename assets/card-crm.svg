<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" role="img" aria-label="CRM product inventory system">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121821"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5C26B"/>
      <stop offset="100%" stop-color="#7DD3C0"/>
    </linearGradient>
    <style><![CDATA[
      .glow { animation: float 5s ease-in-out infinite; }
      @keyframes float {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-5px); opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow { animation: none; opacity: 0.65; }
      }
    ]]></style>
  </defs>
  <rect width="360" height="180" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="358" height="178" rx="15" fill="none" stroke="#243041"/>
  <circle class="glow" cx="300" cy="42" r="42" fill="#F5C26B" fill-opacity="0.1"/>
  <text x="24" y="42" fill="#7DD3C0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">FEATURED</text>
  <text x="24" y="76" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">CRM Inventory</text>
  <text x="24" y="104" fill="#9AA3AF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">React | Firebase | 1C | OpenRouter AI</text>
  <rect x="24" y="128" width="120" height="28" rx="8" fill="url(#a)"/>
  <text x="40" y="147" fill="#0B0F14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Live demo -></text>
</svg>
