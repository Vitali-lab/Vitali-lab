<svg xmlns="http://www.w3.org/2000/svg" width="760" height="24" viewBox="0 0 760 24" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F14" stop-opacity="0"/>
      <stop offset="35%" stop-color="#F5C26B" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#7DD3C0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .pulse { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep {
        0%, 100% { opacity: 0.35; transform: translateX(-40px); }
        50% { opacity: 1; transform: translateX(40px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; opacity: 0.7; transform: none; }
      }
    ]]></style>
  </defs>
  <rect width="760" height="24" fill="transparent"/>
  <g class="pulse">
    <rect x="80" y="11" width="600" height="2" rx="1" fill="url(#line)"/>
  </g>
</svg>
